<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cutline Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Catamaran:wght@500;800&family=Dancing+Script:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,600&display=swap">
<style>
/* Layout: editor shell — media bin | preview stage | inspector, with a full-width multi-track timeline below. Stacks to one column on phones. */
:root{
  --bg:#121117; --panel:#1a1921; --raised:#24222d; --sunk:#0e0d12; --line:#33303e; --fg:#ecebf2; --muted:#9c98aa;
  --accent:#f4a236; --accent-ink:#221604; --clip:#2b8a85; --txt:#c45c84; --stk:#b8862f; --aud:#6669d2; --beat:#f4a236; --danger:#e5574f; --ok:#3fae73;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f2f1f6; --panel:#ffffff; --raised:#ebe9f1; --sunk:#e3e1ea; --line:#d6d3df; --fg:#1d1b24; --muted:#625e70;
  --accent:#ec9420; --accent-ink:#221604; --clip:#2a817c; --txt:#b44c75; --stk:#a2741f; --aud:#5659c4; --beat:#d27f0c; --danger:#cf3f37; --ok:#2b8f5a;
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f2f1f6; --panel:#ffffff; --raised:#ebe9f1; --sunk:#e3e1ea; --line:#d6d3df; --fg:#1d1b24; --muted:#625e70;
  --accent:#ec9420; --accent-ink:#221604; --clip:#2a817c; --txt:#b44c75; --stk:#a2741f; --aud:#5659c4; --beat:#d27f0c; --danger:#cf3f37; --ok:#2b8f5a;
  color-scheme:light; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr) 312px;grid-template-rows:auto minmax(0,1fr) 270px;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

header{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;position:relative}
.brand{display:flex;align-items:center;gap:9px;font:800 20px/1 var(--f-display);letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.pname{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;min-width:0;width:180px;color:var(--fg);font-weight:600}
.pname:hover{border-color:var(--line)} .pname:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.status{font:500 11px/1 var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--ok)} .status.warn i{background:var(--danger)}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;font:500 12px/1.2 var(--f-mono);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg.text button{font:600 12px/1.2 var(--f-body)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn:disabled{opacity:.45;cursor:default}
.btn.icon{padding:6px}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--raised)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:220px;box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--raised)}
.menu small{display:block;color:var(--muted);font-size:11.5px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font:700 12.5px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);flex:1}
.pbody{overflow:auto;padding:12px;min-height:0;flex:1}

.bin{grid-column:1;grid-row:2}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:12px}
.drop strong{color:var(--fg)}
.app.dragover .drop{border-color:var(--accent);color:var(--fg)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px;border-radius:8px;border:1px solid transparent}
.mitem:hover{background:var(--raised);border-color:var(--line)}
.mthumb{width:56px;height:38px;border-radius:5px;background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;color:var(--muted)}
.mthumb svg{width:18px;height:18px}
.mname{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmeta{font:400 11px/1.3 var(--f-mono);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mact{display:flex;gap:2px}
.badge{font:600 9.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;border-radius:4px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}

.stage{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:8px;min-height:0;position:relative}
.stagebox{flex:1;min-height:0;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.frame{position:relative;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
.frame canvas{display:block;width:100%;height:100%;touch-action:none}
.frame canvas.grab{cursor:grab} .frame canvas.resize{cursor:nwse-resize}
.safe{position:absolute;inset:0;pointer-events:none}
.safe .zone{position:absolute;border:1.5px dashed rgba(255,255,255,.55);border-radius:3px}
.safe .lbl{position:absolute;left:6px;top:4px;font:500 10px/1.2 var(--f-mono);color:rgba(255,255,255,.8);background:rgba(0,0,0,.45);padding:2px 5px;border-radius:3px}
.safe .shade{position:absolute;background:rgba(0,0,0,.28)}
.transport{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc{font:500 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:7px}
.tc span{color:var(--muted)}
.play{width:40px;height:34px;justify-content:center}
.tapbar{position:absolute;left:12px;right:12px;bottom:52px;z-index:12;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px}
.tapbar .now{font:700 18px/1.25 var(--f-display);text-wrap:balance}
.tapbar .nxt{font-size:12.5px;color:var(--muted)}
.tapbar .row{justify-content:space-between}

.insp{grid-column:3;grid-row:2}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font:600 11px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.inp{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:vertical;min-height:64px;line-height:1.35}
.num{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangeval{font:500 11.5px/1 var(--f-mono);color:var(--muted);min-width:44px;text-align:right}
.slider{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:3px 0}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel) inset}
input[type=color]{width:30px;height:26px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:1px;cursor:pointer}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.preset{border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);min-width:0}
.preset b{font-size:14px;color:var(--fg);white-space:nowrap}
.preset[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.look{border:1px solid var(--line);border-radius:7px;cursor:pointer;padding:0;overflow:hidden;background:var(--sunk);display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.look span{display:block;height:34px;background-size:cover;background-position:center}
.look em{font-style:normal;padding:4px 0}
.look[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
.fontsel{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fontsel button{border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:7px 6px;cursor:pointer;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontsel button[aria-pressed="true"]{border-color:var(--accent)}
details{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:14px}
details summary{cursor:pointer;font:600 11px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
details[open] summary{margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:0 0 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.divider{height:1px;background:var(--line);margin:4px 0 14px}
.selhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.selhead .dot{width:10px;height:10px;border-radius:3px;flex:none}
.selhead h3{margin:0;font:700 16px/1.2 var(--f-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emojis button{border:1px solid transparent;background:var(--sunk);border-radius:6px;font-size:20px;line-height:1;padding:6px 0;cursor:pointer}
.emojis button:hover{border-color:var(--accent)}

.tl{grid-column:1/-1;grid-row:3}
.tlhead{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tlhead .zoom{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.tlhead .zoom input{width:100px}
.keys{font:400 11px/1.2 var(--f-mono);color:var(--muted)}
.tlbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:78px minmax(0,1fr)}
.tllabels{position:relative;border-right:1px solid var(--line);background:var(--panel)}
.tllabels div{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;padding-left:10px;font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tllabels i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tlscroll{overflow-x:auto;overflow-y:hidden;position:relative}
.tlinner{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.ruler{position:absolute;left:0;right:0;top:0;height:24px;border-bottom:1px solid var(--line);cursor:col-resize;background:var(--panel)}
.tick{position:absolute;top:14px;width:1px;height:10px;background:var(--line)}
.tick.major{top:8px;height:16px;background:var(--muted);opacity:.6}
.tick em{position:absolute;left:4px;top:-2px;font:400 10px/1 var(--f-mono);font-style:normal;color:var(--muted);white-space:nowrap}
.beatm{position:absolute;width:2px;background:var(--beat);opacity:.55;pointer-events:none;border-radius:1px}
.beatd{position:absolute;top:17px;width:7px;height:7px;margin-left:-3px;background:var(--beat);transform:rotate(45deg);pointer-events:none}
.lane{position:absolute;left:0;right:0;background:var(--sunk);opacity:.55;border-radius:4px}
.blk{position:absolute;border-radius:6px;overflow:hidden;cursor:grab;display:flex;flex-direction:column;justify-content:space-between;padding:4px 8px;color:#fff;border:1.5px solid transparent}
.blk:active{cursor:grabbing}
.blk.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);z-index:3}
.blk .bn{font:600 11.5px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.blk .bd{font:500 10px/1 var(--f-mono);opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden}
.vclip{background-color:var(--clip);background-repeat:repeat-x;background-size:auto 100%}
.vclip::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0) 45%,rgba(0,0,0,.45));pointer-events:none}
.vclip>*{position:relative}
.tblk{background:var(--txt);padding:0 8px;justify-content:center}
.sblk{background:var(--stk);padding:0 8px;justify-content:center}
.tblk .bn,.sblk .bn{font-size:11px}
.ablk{background-color:var(--aud);background-repeat:repeat-x;justify-content:center}
.hdl{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2;display:grid;place-items:center}
.hdl::after{content:"";width:3px;height:45%;border-radius:2px;background:rgba(255,255,255,.85)}
.hdl.l{left:0} .hdl.r{right:0}
.blk.dragging{opacity:.85;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.trn{position:absolute;z-index:4;height:18px;min-width:18px;margin-left:-9px;border-radius:9px;background:var(--fg);color:var(--bg);font:700 10px/18px var(--f-mono);text-align:center;padding:0 5px;cursor:pointer;border:0}
.insert{position:absolute;width:3px;background:var(--accent);border-radius:2px;z-index:6;pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:0;z-index:8;pointer-events:none}
.playhead::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--accent)}
.playhead::after{content:"";position:absolute;left:-6px;top:0;border:6px solid transparent;border-top:8px solid var(--accent)}
.empty-tl{position:absolute;left:12px;font-size:12.5px;color:var(--muted);white-space:nowrap}

.scrim{position:fixed;inset:0;background:rgba(8,7,12,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(480px,100%);max-height:100%;overflow:auto;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.modal h2{margin:0 0 4px;font:800 22px/1.15 var(--f-display);text-wrap:balance}
.modal p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s linear}
.modal video{width:100%;max-height:320px;background:#000;border-radius:8px;margin-bottom:12px}
.mactions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pick label{position:relative;cursor:pointer;border-radius:8px;overflow:hidden;border:2px solid var(--line);aspect-ratio:1;background:var(--sunk) center/cover}
.pick input{position:absolute;top:6px;left:6px;width:16px;height:16px;accent-color:var(--accent)}
.pick label:has(input:checked){border-color:var(--accent)}
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center}

@media (max-width:960px){
  html,body{height:auto;overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;gap:10px}
  header,.stage,.tl,.insp,.bin{grid-column:1;grid-row:auto}
  .stagebox{height:min(62vh,560px);flex:none}
  .tl{height:300px}
  .pbody{overflow:visible}
  .pname{width:130px}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="4" fill="var(--accent)"/><path d="M3 12h26M3 20h26" stroke="var(--accent-ink)" stroke-width="1.6"/><path d="M12 7l8 18" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/></svg>
      Cutline
    </div>
    <input class="pname" id="pname" aria-label="Project name" value="Weekly vlog">
    <span class="status" id="saveStatus"><i></i><span>Not saved yet</span></span>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Video format" id="aspectSeg">
      <button data-a="9:16" title="Reels, Shorts, TikTok">9:16</button>
      <button data-a="4:5" title="Instagram feed">4:5</button>
      <button data-a="1:1" title="Square">1:1</button>
      <button data-a="16:9" title="YouTube">16:9</button>
    </div>
    <button class="btn icon ghost" id="undoBtn" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="btn icon ghost" id="redoBtn" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="btn" id="projBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Project</button>
    <div class="menu" id="projMenu" hidden>

// ================= saving: browser storage (IndexedDB) =================
const DB = { db:null };
function dbOpen(){ return new Promise(res => { let done = false; const fin = v => { if (!done){ done = true; res(v); } }; setTimeout(() => fin(false), 2500);
  try { const r = indexedDB.open("cutline", 1); r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("media"); };
    r.onsuccess = () => { DB.db = r.result; fin(true); }; r.onerror = () => fin(false); r.onblocked = () => fin(false); } catch(e){ fin(false); } }); }
function dbReq(store, mode, fn){ return new Promise(res => { if (!DB.db){ res(null); return; } try { const tx = DB.db.transaction(store, mode), st = tx.objectStore(store), r = fn(st);
  tx.oncomplete = () => res(r && "result" in r ? r.result : true); tx.onerror = tx.onabort = () => res(null); } catch(e){ res(null); } }); }
const dbPut = (s, k, v) => dbReq(s, "readwrite", st => st.put(v, k));
const dbGet = (s, k) => dbReq(s, "readonly", st => st.get(k));
const dbDel = (s, k) => dbReq(s, "readwrite", st => st.delete(k));
const dbAll = s => dbReq(s, "readonly", st => st.getAll());
const mediaRec = m => ({ id:m.id, kind:m.kind, name:m.name, sample:!!m.sample, sceneKey:m.sceneKey || null, duration:m.duration, blob:m.sample ? null : m.blob });
function saveMedia(m){ if (DB.db) dbPut("media", m.id, mediaRec(m)).then(ok => { if (!ok) setStatus("warn", "Couldn't save media in this browser"); }); }
let saveT = 0;
function scheduleSave(){ if (!DB.db) return; clearTimeout(saveT); setStatus("", "Saving…"); saveT = setTimeout(() => dbPut("kv", "project", snap()).then(ok => setStatus(ok ? "ok" : "warn", ok ? "Saved in this browser" : "Not saved: browser storage is off")), 900); }
function setStatus(cls, txt){ const s = $("#saveStatus"); s.className = "status " + cls; s.lastElementChild.textContent = txt; }
async function loadFromBrowser(){
  const proj = await dbGet("kv", "project"); if (!proj) return false;
  const recs = (await dbAll("media")) || [];
  await Promise.all(recs.map(r => new Promise(res => {
    if (r.sample){ if (r.sceneKey && (SCENES[r.sceneKey] || r.sceneKey === "loop")) addSampleMedia(r.sceneKey); res(); return; }
    if (!r.blob){ res(); return; }
    const fn = r.kind === "video" ? addVideoMedia : r.kind === "image" ? addImageMedia : addAudioMedia; fn(r, () => res(), () => res()); setTimeout(res, 8000);
  })));
  applyProject(JSON.parse(proj)); return true;
}

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,size,true); lh.setUint32(22,size,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer, nm, f.blob);
    const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,offset,true);

  const cdSize = central.reduce((a,b) => a + (b.byteLength ?? b.length), 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...parts, ...central, end.buffer], { type:"application/zip" });
}
async function readZip(file){
  const tailStart = Math.max(0, file.size - 65557), tail = new DataView(await file.slice(tailStart).arrayBuffer()); let p = -1;
  for (let i = tail.byteLength - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50){ p = i; break; }
  if (p < 0) throw new Error("not a zip");
  const n = tail.getUint16(p + 10, true), cdSize = tail.getUint32(p + 12, true), cdOff = tail.getUint32(p + 16, true);
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer()), dec = new TextDecoder(), out = {}; let q = 0;
  for (let k = 0; k < n; k++){
    const method = cd.getUint16(q + 10, true), size = cd.getUint32(q + 20, true), nl = cd.getUint16(q + 28, true), el = cd.getUint16(q + 30, true), cl = cd.getUint16(q + 32, true), lo = cd.getUint32(q + 42, true);
    const name = dec.decode(new Uint8Array(cd.buffer, q + 46, nl));
    const lh = new DataView(await file.slice(lo, lo + 30).arrayBuffer()), start = lo + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    if (method === 0) out[name] = file.slice(start, start + size);
    q += 46 + nl + el + cl;
  }
  return out;
}
const extOf = (m) => { const n = (m.name || "").toLowerCase().match(/\.([a-z0-9]{2,5})$/); return n ? n[1] : m.kind === "video" ? "mp4" : m.kind === "image" ? "jpg" : "mp3"; };
async function saveProjectFile(){
  const used = usedMedia(), list = [...media.values()].filter(m => used.has(m.id) || (!m.sample && m.kind === "image"));
  toast("Packing your project…");
  const meta = { format:"cutline-project", version:2, project:snapObj(), media:list.map(m => ({ id:m.id, kind:m.kind, name:m.name, sample:!!m.sample, sceneKey:m.sceneKey || null, duration:m.duration, file:m.sample ? null : `media/${m.id}.${extOf(m)}` })) };
  const files = [{ name:"project.json", blob:new Blob([JSON.stringify(meta, null, 1)], { type:"application/json" }) }];
  list.forEach(m => { if (!m.sample && m.blob) files.push({ name:`media/${m.id}.${extOf(m)}`, blob:m.blob }); });
  const zip = await buildZip(files);
  saveBlob(zip, `${slug()}.zip`, "Project file saved");
}
async function openProjectFile(file){
  try {
    const files = await readZip(file), pj = files["project.json"]; if (!pj) throw new Error("no project");
    const meta = JSON.parse(await pj.text()); if (meta.format !== "cutline-project") throw new Error("not cutline");
    toast("Opening project…");
    await Promise.all(meta.media.map(r => new Promise(res => {
      if (media.has(r.id)){ res(); return; }
      if (r.sample){ if (SCENES[r.sceneKey] || r.sceneKey === "loop") addSampleMedia(r.sceneKey); res(); return; }
      const blob = files[r.file]; if (!blob){ res(); return; }
      const named = new File([blob], r.name, { type:blob.type });
      const fn = r.kind === "video" ? addVideoMedia : r.kind === "image" ? addImageMedia : addAudioMedia;
      fn({ id:r.id, name:r.name, blob:named }, m => { saveMedia(m); res(); }, () => res()); setTimeout(res, 10000);
    })));
    checkpoint(); applyProject(meta.project); sel = null; T = 0; applySize(); renderAll(); toast(`Opened ${S.name}`);
  } catch(e){ toast("That file isn't a Cutline project."); }
}
function newProject(){ checkpoint(); S.clips = []; S.texts = []; S.overlays = []; S.music = null; S.beats = []; S.name = "Untitled"; $("#pname").value = S.name; sel = null; T = 0; renderAll(); toast("New project. Press Undo to get the last one back."); }

// ================= export & file saving =================
let rec = null, chunks = [], exportMime = "", exportBlob = null, exportUrl = "", dl = null, exportTimer = 0;
try { window.claude && window.claude.use && window.claude.use("downloads").then(x => dl = x).catch(() => {}); } catch(e){}
const slug = () => (S.name || "video").trim().replace(/[^\w\- ]+/g,"").replace(/\s+/g,"-").toLowerCase() || "video";
async function saveBlob(blob, filename, okMsg){
  if (dl){ try { await dl.save({ filename, data:blob }); toast(okMsg || `Saved ${filename}`); return true; }
    catch(e){ const c = e && e.code; toast(c === "declined" ? "Save cancelled." : c === "rate_limited" ? "A save prompt is already open." : c === "too_large" ? "This file is too large to save here." : "Couldn't save the file here."); return false; } }
  if (window.claude){ toast("Saving files isn't available in this view. Open the page in claude.ai or the Claude app."); return false; }
  const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); toast(okMsg || `Saved ${filename}`); return true;
}
function pickMime(){ if (!window.MediaRecorder) return "";
  return ["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch(e){ return false; } }) || ""; }
const extFor = m => m.startsWith("video/mp4") ? "mp4" : "webm";
function showExportSetup(){
  pause(); const mime = pickMime(), [w,h] = SIZES[S.quality][S.aspect];
  if (!mime || !cv.captureStream){ openModal(`<h2>Export isn't supported in this browser</h2><p>Recording video from the editor needs a recent Chrome, Edge, Firefox or Safari.</p><div class="mactions"><button class="btn" id="mClose">Close</button></div>`); $("#mClose").onclick = closeModal; return; }
  openModal(`<h2>Export ${esc(S.name || "video")}</h2><p>${S.aspect} at ${w}×${h}, ${fmt(total())} long, saved as ${extFor(mime).toUpperCase()}.</p>
    <div class="field"><span class="flabel">Quality</span><div class="seg" role="group"><button data-eq="720" aria-pressed="${S.quality === "720"}">720p</button><button data-eq="1080" aria-pressed="${S.quality === "1080"}">1080p</button></div></div>
    <p class="note">The editor plays your project once from the start to record it, so export takes as long as the video. Keep this tab open and in front until it finishes.</p>
    <div class="mactions"><button class="btn" id="mClose">Cancel</button><button class="btn primary" id="mGo">Start export</button></div>`);
  $("#modal").querySelectorAll("[data-eq]").forEach(b => b.onclick = () => { S.quality = b.dataset.eq; applySize(); renderInspector(); showExportSetup(); });
  $("#mClose").onclick = closeModal; $("#mGo").onclick = startExport;
}
function startExport(){
  ensureAudio(); exportMime = pickMime(); if (sel && (sel.type === "text" || sel.type === "overlay")) sel = null; applySize();
  const tracks = [...cv.captureStream(30).getVideoTracks()]; if (recDest) tracks.push(...recDest.stream.getAudioTracks());
  try { rec = new MediaRecorder(new MediaStream(tracks), { mimeType:exportMime, videoBitsPerSecond:S.quality === "1080" ? 10e6 : 6e6, audioBitsPerSecond:160000 }); }
  catch(e){ try { rec = new MediaRecorder(new MediaStream(tracks)); exportMime = rec.mimeType || "video/webm"; } catch(e2){ toast("This browser couldn't start recording."); closeModal(); return; } }
  chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); }; rec.onstop = onExportDone;
  openModal(`<h2>Exporting…</h2><p id="eMsg">Recording 00:00 of ${fmt(total())}</p><div class="bar"><i id="eBar"></i></div><div class="mactions"><button class="btn" id="eCancel">Cancel</button></div>`);
  $("#eCancel").onclick = () => { exporting = false; pause(); rec.onstop = null; try { rec.stop(); } catch(e){} clearInterval(exportTimer); closeModal(); toast("Export cancelled"); };
  T = 0; syncMedia(); draw();
  setTimeout(() => { exporting = true; rec.start(250); play();
    exportTimer = setInterval(() => { const p = total() ? T/total() : 1, b = $("#eBar"), m = $("#eMsg"); if (b) b.style.width = (p*100).toFixed(1) + "%"; if (m) m.textContent = `Recording ${fmt(T)} of ${fmt(total())}`; }, 200); }, 400);
}
function finishExport(){ exporting = false; pause(); clearInterval(exportTimer); setTimeout(() => { try { rec.requestData(); rec.stop(); } catch(e){} }, 150); }
function onExportDone(){
  exportBlob = new Blob(chunks, { type:exportMime.split(";")[0] }); if (exportUrl) URL.revokeObjectURL(exportUrl); exportUrl = URL.createObjectURL(exportBlob);
  const mb = (exportBlob.size/1048576).toFixed(1), ext = extFor(exportMime);
  openModal(`<h2>Your video is ready</h2><p>${S.aspect} · ${fmt(total())} · ${mb} MB · ${ext.toUpperCase()}</p><video src="${exportUrl}" controls playsinline></video>
    <div class="mactions"><button class="btn" id="mClose">Close</button><button class="btn primary" id="mSave">Save video</button></div>`);
  $("#mClose").onclick = closeModal; $("#mSave").onclick = () => saveBlob(exportBlob, `${slug()}.${ext}`, `Saved ${slug()}.${ext}`);
}

// ================= wiring =================
$("#playBtn").onclick = toggle; $("#toStart").onclick = () => seek(0); $("#toEnd").onclick = () => seek(total());
$("#splitBtn").onclick = splitAtPlayhead; $("#delBtn").onclick = deleteSel;
$("#addTextBtn").onclick = () => addText("title"); $("#addCapBtn").onclick = openTapCaptions; $("#addStkBtn").onclick = openStickers; $("#beatBtn").onclick = addBeat;
$("#snapBtn").onclick = () => { snapOn = !snapOn; $("#snapBtn").setAttribute("aria-pressed", snapOn); };
$("#undoBtn").onclick = undo; $("#redoBtn").onclick = redo; $("#exportBtn").onclick = showExportSetup;
$("#importBtn").onclick = () => $("#fileIn").click(); $("#fileIn").onchange = e => { importFiles(e.target.files); e.target.value = ""; };
$("#projBtn").onclick = e => { e.stopPropagation(); const m = $("#projMenu"); m.hidden = !m.hidden; $("#projBtn").setAttribute("aria-expanded", !m.hidden); };
document.addEventListener("click", e => { if (!e.target.closest("#projMenu")) { $("#projMenu").hidden = true; $("#projBtn").setAttribute("aria-expanded", "false"); } });
$("#projMenu").addEventListener("click", e => { const b = e.target.closest("[data-pm]"); if (!b) return; $("#projMenu").hidden = true;
  if (b.dataset.pm === "save") saveProjectFile(); else if (b.dataset.pm === "open") $("#projIn").click(); else newProject(); });
$("#projIn").onchange = e => { if (e.target.files[0]) openProjectFile(e.target.files[0]); e.target.value = ""; };
$("#pname").addEventListener("change", e => { checkpoint(); S.name = e.target.value.trim() || "Untitled"; });
$("#zoom").addEventListener("input", e => { const sc = $("#tlScroll"), center = (sc.scrollLeft + sc.clientWidth/2)/pps; pps = +e.target.value; renderTimeline(); sc.scrollLeft = center*pps - sc.clientWidth/2; });
$("#aspectSeg").addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b || b.dataset.a === S.aspect) return; checkpoint(); S.aspect = b.dataset.a; applySize(); renderInspector(); });
$("#safeBtn").onclick = () => { showSafe = !showSafe; $("#safeBtn").setAttribute("aria-pressed", showSafe); renderSafe(); };
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim" && !exporting) closeModal(); });
const app = $("#app"); let dragDepth = 0;
window.addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")){ dragDepth++; app.classList.add("dragover"); } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) app.classList.remove("dragover"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; app.classList.remove("dragover"); if (e.dataTransfer?.files?.length) importFiles(e.dataTransfer.files); });
window.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable) return;
  if (!$("#scrim").hidden){ if (e.key === "Escape" && !exporting) closeModal(); return; }
  const mod = e.ctrlKey || e.metaKey, k = e.key;
  if (tap && (k === " " || k === "Enter")){ e.preventDefault(); tapNext(); return; }
  if (tap && k === "Escape"){ endTap(); return; }
  if (mod && k.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase() === "y"){ e.preventDefault(); redo(); return; }
  if (mod && k.toLowerCase() === "d"){ e.preventDefault(); duplicateSel(); return; }
  if (mod && k.toLowerCase() === "s"){ e.preventDefault(); saveProjectFile(); return; }
  if (mod) return;
  if (k === " "){ e.preventDefault(); toggle(); }
  else if (k === "s" || k === "S") splitAtPlayhead();
  else if (k === "t" || k === "T") addText("title");
  else if (k === "b" || k === "B") addBeat();
  else if (k === "Delete" || k === "Backspace"){ e.preventDefault(); deleteSel(); }
  else if (k === "ArrowLeft"){ e.preventDefault(); seek(T - (e.shiftKey ? 1 : 1/30)); }
  else if (k === "ArrowRight"){ e.preventDefault(); seek(T + (e.shiftKey ? 1 : 1/30)); }
  else if (k === "Home") seek(0); else if (k === "End") seek(total());
  else if (k === "Escape" && sel){ sel = null; renderTimeline(); renderInspector(); }
});
new ResizeObserver(() => fitFrame()).observe($("#stagebox"));
let rT = 0; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(renderTimeline, 120); });

// ================= sample project =================
function loadSampleProject(){
  ["golden","neon","tide","loop"].forEach(k => { if (!media.has("s-" + k)){ const m = addSampleMedia(k); saveMedia(m); } });
  S.clips = [ mkClip("s-golden", 4, { fx:mkFx("warm"), motion:"push", trans:{ type:"fade", d:.6 } }),
              mkClip("s-neon", 4.5, { motion:"punch", zoomAmt:.2, trans:{ type:"flash", d:.4 } }),
              mkClip("s-tide", 4, { fx:mkFx("soft") }) ];
  S.texts = [ mkText("title", "3 things that changed my week", .25, 3.6), mkText("step", "1. Wake up early ☀️", .25, 3.6),
              mkText("words", "Wake up before the city does", 4.2, 7.8), mkText("script", "chase the light", 8.5, 12.3) ];
  S.texts[1].y = .12; S.texts[3].y = .5;
  S.overlays = [ { id:uid("o"), kind:"emoji", emoji:"✨", start:8.6, end:12.3, x:.78, y:.38, w:.14, rot:12, opacity:1, anim:"float", shadow:false } ];
  S.music = { mediaId:"s-loop", volume:.55, loop:true, fade:true, duck:true, duckLevel:.3, offset:0 };
  refreshLayout(); const mi = media.get("s-loop").beatInfo; S.beats = [];
  if (mi){ const d = media.get("s-loop").duration; for (let k = 0; k < 3; k++) mi.beats.forEach(b => { const t = b + k*d; if (t <= total()) S.beats.push(r2(t)); }); }
}

// ================= boot =================
(async () => {
  updPlayBtn();
  const ok = await dbOpen();
  let restored = false;
  if (ok){ try { restored = await loadFromBrowser(); } catch(e){ restored = false; } }
  if (!restored) loadSampleProject();
  ["golden","neon","tide","loop"].forEach(k => { if (!media.has("s-" + k)){ const m = addSampleMedia(k); saveMedia(m); } });
  refreshLayout(); applySize(); renderAll();
  setStatus(ok ? "ok" : "warn", ok ? (restored ? "Restored from this browser" : "Saved in this browser") : "Browser saving is off. Use Project › Save");
  if (restored) toast("Welcome back. Your last project is open.");
  if (document.fonts && document.fonts.load) Object.values(FONTS).forEach(f => document.fonts.load(`${f.w} 40px ${f.css}`, "Aaதமிழ்").catch(()=>{}));
  requestAnimationFrame(t => { last = t; frame(t); });
})();
})();
